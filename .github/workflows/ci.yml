name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: gofmt
        run: make fmt

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: dependency budget
        run: make deps-check

      - name: build
        run: make build

      - name: binary size
        run: make size
